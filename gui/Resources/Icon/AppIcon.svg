<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- RTL8723BE Wi-Fi app icon (Issen Software Group house style, shared with TetherKitNext).
       Source of truth: gui/Scripts/make-icon.sh renders AppIcon.icns and docs/assets/icon.png.
       macOS icon grid: 824x824 rounded square centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#2BD4C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" fill-opacity="0.30"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  </g>

  <!-- signal: three arcs and a dot rising from the card -->
  <path d="M 404 452 A 152 152 0 0 1 620 452" fill="none" stroke="url(#accent)"
        stroke-width="34" stroke-linecap="round"/>
  <path d="M 336 384 A 248 248 0 0 1 688 384" fill="none" stroke="url(#accent)"
        stroke-width="34" stroke-linecap="round" stroke-opacity="0.80"/>
  <path d="M 268 316 A 344 344 0 0 1 756 316" fill="none" stroke="url(#accent)"
        stroke-width="34" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle cx="512" cy="520" r="30" fill="#3DDC84"/>

  <!-- PCIe Wi-Fi card -->
  <rect x="262" y="596" width="500" height="196" rx="34" fill="#0B1222"
        stroke="#F5F7FA" stroke-width="30"/>
  <rect x="318" y="642" width="104" height="104" rx="18" fill="#F5F7FA"/>
  <rect x="460" y="652" width="246" height="22" rx="11" fill="#F5F7FA" fill-opacity="0.55"/>
  <rect x="460" y="714" width="170" height="22" rx="11" fill="#F5F7FA" fill-opacity="0.35"/>
  <!-- edge connector -->
  <g fill="url(#accent)">
    <rect x="318" y="806" width="22" height="44" rx="6"/>
    <rect x="356" y="806" width="22" height="44" rx="6"/>
    <rect x="394" y="806" width="22" height="44" rx="6"/>
    <rect x="432" y="806" width="22" height="44" rx="6"/>
    <rect x="530" y="806" width="22" height="44" rx="6"/>
    <rect x="568" y="806" width="22" height="44" rx="6"/>
    <rect x="606" y="806" width="22" height="44" rx="6"/>
    <rect x="644" y="806" width="22" height="44" rx="6"/>
    <rect x="682" y="806" width="22" height="44" rx="6"/>
  </g>
</svg>
